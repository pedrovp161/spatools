[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# PEP 621 — fonte única de verdade dos metadados (o setup.py foi removido).
[project]
name = "spatools"
version = "0.41.5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
description = "This comprehensive toolkit enables the analysis of multiple spatial transcriptomics datasets, offering a wide range of analytical capabilities. It supports various types of analyses, including detailed plotting and advanced image analysis, to help you gain deeper insights into your spatial transcriptomics data."

authors = [
    { name = "Pedro Videira Pinho", email = "pedrovp161@gmail.com" },
    { name = "Mariana Lima Boroni Martins", email = "mariana.boroni@inca.gov.br" }
]

keywords = [
    "Python",
    "Spatial transcriptomics",
    "Spatial",
    "transcriptomics",
    "Multi-sample",
    "Colocalization-analysis",
    "Bioinformatics"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: Unix",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License"
]

dependencies = [
    "scanpy>=1.10.1",
    "anndata>=0.10",
    "mygene>=3.2.2",
    "pybiomart>=0.2.0",
    "scikit-image>=0.22",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.10",
    "pmenu_lib>=1.2.2"
]

[project.optional-dependencies]
dev = ["twine>=5.1.1", "build"]

[project.urls]
Homepage = "https://pypi.org/project/spatools/"
Repository = "https://github.com/pedrovp161/spatools"

[tool.setuptools.packages.find]
include = ["spatools*"]

[tool.setuptools]
include-package-data = true
license-files = ["LICENCE"]

[tool.setuptools.package-data]
spatools = ["py.typed"]
